<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="title desc">
  <title id="title">You Don't Need Cursor</title>
  <desc id="desc">A terminal window showing a tiny agent loop: read file, think, write file, done.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ee787"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- terminal window -->
  <rect x="40" y="34" width="480" height="232" rx="10" fill="#010409" stroke="#30363d" stroke-width="1.5"/>
  <rect x="40" y="34" width="480" height="30" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="60" cy="49" r="6" fill="#ff5f56"/>
  <circle cx="80" cy="49" r="6" fill="#ffbd2e"/>
  <circle cx="100" cy="49" r="6" fill="#27c93f"/>
  <text x="280" y="53" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#8b949e">checkpoint-3.html</text>

  <text x="60" y="96" font-family="Menlo, Consolas, monospace" font-size="15" fill="#8b949e">→ read_file("app.js")</text>
  <text x="60" y="122" font-family="Menlo, Consolas, monospace" font-size="15" fill="#c9d1d9">result: [full file contents]</text>
  <text x="60" y="152" font-family="Menlo, Consolas, monospace" font-size="15" fill="#e3b341">💭 loop uses i &lt;= end, comment says exclusive.</text>
  <text x="60" y="178" font-family="Menlo, Consolas, monospace" font-size="15" fill="#7ee787">→ write_file("app.js")</text>
  <text x="60" y="204" font-family="Menlo, Consolas, monospace" font-size="15" fill="#8b949e">- for (i = start; i &lt;= end; i++)</text>
  <text x="60" y="228" font-family="Menlo, Consolas, monospace" font-size="15" fill="#7ee787">+ for (i = start; i &lt; end; i++)</text>
  <text x="60" y="254" font-family="Menlo, Consolas, monospace" font-size="15" fill="#58a6ff">✅ Fixed. Approve write? [Y]</text>

  <!-- title block -->
  <text x="562" y="128" font-family="Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#f0f6fc">You Don't Need</text>
  <text x="562" y="182" font-family="Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="url(#accent)">Cursor</text>
  <text x="562" y="216" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#8b949e">Build the agent loop yourself. One HTML file.</text>
  <text x="562" y="244" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#8b949e">Zero deps. Zero network calls. Zero signup.</text>

  <rect x="562" y="262" width="10" height="10" fill="#7ee787"/>
  <text x="580" y="271" font-family="Menlo, Consolas, monospace" font-size="14" fill="#7ee787">4 checkpoints, ~60s to first win</text>
</svg>
